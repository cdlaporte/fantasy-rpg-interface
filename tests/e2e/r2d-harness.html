<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>r2d harness</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #111; color: #eee; font: 12px system-ui, sans-serif; }
    #view { position: fixed; inset: 0; }
    #view > canvas { position: absolute; left: 0; top: 0; display: block; }
    #bar { position: fixed; left: 8px; top: 8px; z-index: 3; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="bar"></div>
  <script type="module" src="r2d-harness.js"></script>
</body>
</html>
